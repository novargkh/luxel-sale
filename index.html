<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXEL — Калейдоскоп знижок | Червень 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;900&display=swap');
:root {
  --red:#E8192C; --red-hover:#c0111f; --red-soft:#fff3f4; --red-mid:#ffd6d9;
  --peach:#fff8f0; --gold:#f0a500; --green:#1a7a35; --green-soft:#edf7f1;
  --dark:#1c1c2e; --body-bg:#fafbfc; --white:#ffffff; --border:#eaedf3;
  --muted:#8a92a8; --text-sm:13px; --text-md:15px; --text-lg:18px;
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --sh-sm:0 2px 8px rgba(0,0,0,.06); --sh-md:0 4px 20px rgba(0,0,0,.09);
  --sh-red:0 8px 32px rgba(232,25,44,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--body-bg);color:var(--dark);font-family:'Exo 2',Arial,sans-serif;font-size:var(--text-md);min-height:100vh;}
/* HEADER */
.header{background:var(--white);border-bottom:3px solid var(--red);padding:14px 40px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:var(--sh-sm);}
.header-logo img{height:40px;display:block;}
.header-center{text-align:center;}
.header-center h1{font-size:18px;font-weight:800;color:var(--dark);}
.header-center p{font-size:var(--text-sm);color:var(--muted);margin-top:2px;}
.header-counter{text-align:right;}
.header-counter .count{font-size:38px;font-weight:900;color:var(--red);line-height:1;}
.header-counter .label{font-size:var(--text-sm);color:var(--muted);font-weight:500;}
/* HERO */
.hero{background:linear-gradient(160deg,var(--white) 0%,#fff5f5 60%,#fff8f0 100%);padding:48px 24px 40px;text-align:center;border-bottom:1px solid var(--border);}
.hero-tag{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-size:var(--text-sm);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 18px;border-radius:30px;margin-bottom:20px;}
.hero h2{font-size:36px;font-weight:900;line-height:1.15;margin-bottom:10px;}
.hero h2 em{color:var(--red);font-style:normal;}
.hero p{font-size:var(--text-lg);color:var(--muted);font-weight:500;}
/* COUNTDOWN */
.countdown-wrap{padding:36px 24px 24px;text-align:center;}
.cd-title{font-size:var(--text-sm);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
.cd-title.urgent{color:var(--red);}
.cd-digits{display:inline-flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 32px;box-shadow:var(--sh-md);}
.cd-block{text-align:center;min-width:64px;}
.cd-block .val{font-size:44px;font-weight:900;color:var(--dark);line-height:1;font-variant-numeric:tabular-nums;transition:color .3s;}
.cd-block .val.urgent{color:var(--red);}
.cd-block .unit{font-size:var(--text-sm);color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
.cd-sep{font-size:36px;font-weight:900;color:var(--red-mid);padding-bottom:20px;}
.cd-next{font-size:var(--text-md);color:var(--muted);margin-top:16px;}
.cd-next strong{color:var(--dark);font-weight:700;}
/* GRID */
.grid-section{padding:8px 24px 64px;max-width:1140px;margin:0 auto;}
.grid-title{text-align:center;font-size:var(--text-sm);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:16px;}
/* CARDS */
.box-card{border-radius:var(--r-md);overflow:hidden;transition:transform .22s ease,box-shadow .22s ease;position:relative;}
.box-card.locked{background:var(--white);border:1.5px solid var(--border);box-shadow:var(--sh-sm);}
.box-card.available{background:linear-gradient(145deg,#fff0f1 0%,#fff5f0 100%);border:2px solid var(--red);box-shadow:var(--sh-red);cursor:pointer;animation:floatCard 3s ease-in-out infinite;}
.box-card.available:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 40px rgba(232,25,44,.28);animation:none;}
.box-card.opened{background:var(--green-soft);border:1.5px solid #b8dfc8;box-shadow:var(--sh-sm);}
.box-card.expired{background:#f5f5f8;border:1.5px dashed #ccc;box-shadow:none;opacity:.7;}
@keyframes floatCard{0%,100%{transform:translateY(0);box-shadow:var(--sh-red);}50%{transform:translateY(-4px);box-shadow:0 12px 36px rgba(232,25,44,.25);}}
.card-shimmer{position:absolute;inset:0;border-radius:var(--r-md);background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);background-size:220% 100%;animation:shimmer 2.5s linear infinite;pointer-events:none;}
@keyframes shimmer{0%{background-position:220% 0}100%{background-position:-220% 0}}
.card-inner{padding:18px 16px 16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;}
.card-date{font-size:var(--text-sm);font-weight:700;color:var(--muted);width:100%;text-align:left;}
.box-card.available .card-date{color:var(--red);}
.box-card.opened   .card-date{color:var(--green);}
.box-card.expired  .card-date{color:#aaa;}
.card-graphic{width:82px;height:82px;flex-shrink:0;}
.card-graphic svg{width:100%;height:100%;}
.card-cta{background:var(--red);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 0;width:100%;font-family:inherit;font-size:var(--text-sm);font-weight:800;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:background .15s,transform .1s;}
.card-cta:hover{background:var(--red-hover);}
.card-cta:active{transform:scale(.97);}
.card-opened{text-align:center;width:100%;}
.card-opened-disc{font-size:32px;font-weight:900;color:var(--green);line-height:1;}
.card-opened-name{font-size:13px;color:var(--dark);margin-top:5px;font-weight:600;line-height:1.35;}
.card-locked-label,.card-expired-label{font-size:var(--text-sm);font-weight:600;}
.card-locked-label{color:var(--muted);}
.card-expired-label{color:#aaa;}
/* POPUP OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,15,30,.65);backdrop-filter:blur(8px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.overlay.active{display:flex;}
.popup{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:480px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.22);animation:popupIn .45s cubic-bezier(.34,1.56,.64,1) both;position:relative;}
@keyframes popupIn{from{transform:scale(.6) translateY(60px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
/* POPUP TOP */
.popup-top{background:linear-gradient(135deg,#E8192C 0%,#c0111f 100%);padding:28px 32px 24px;text-align:center;position:relative;overflow:hidden;}
.popup-top::before{content:'';position:absolute;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%;top:-80px;right:-60px;}
.popup-top::after{content:'';position:absolute;width:140px;height:140px;background:rgba(255,255,255,.05);border-radius:50%;bottom:-50px;left:-40px;}
.popup-gift{width:88px;height:88px;margin:0 auto 12px;animation:giftFloat 3s ease-in-out infinite;position:relative;z-index:1;}
@keyframes giftFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.popup-discount{font-size:64px;font-weight:900;color:#fff;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,.2);position:relative;z-index:1;animation:discIn .4s .35s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes discIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* POPUP BODY */
.popup-body{padding:24px 32px 28px;display:flex;flex-direction:column;gap:14px;}
